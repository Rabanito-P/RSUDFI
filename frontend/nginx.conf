# UNDC RSU — Nginx reverse proxy + SPA fallback + gzip · PostgreSQL 18 stack
# El upstream del API se resuelve en el arranque con envsubst (docker-entrypoint
# procesa /etc/nginx/templates/*.template): el stack principal usa backend:8080
# (DNS interno de Docker); despliegues alternativos pueden apuntar al host.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32M;

    # Logs a stdout para docker
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip y compresion
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # No se muestra la versión exacta de nginx (no da ventaja al atacante).
    server_tokens off;

    # Seguridad (OWASP A05 / ISO 27001 A.13).
    # Nota: en nginx, si un location declara sus propios add_header, los del
    # nivel server NO se heredan. Por eso las cabeceras viven en un snippet
    # incluido en cada location que responde contenido.
    #
    #   X-Frame-Options      → impide incrustar la app en iframes ajenos (clickjacking)
    #   X-Content-Type-Options → el navegador no adivina el tipo de contenido
    #   Referrer-Policy      → no se filtra la ruta completa a terceros
    #   HSTS                 → fuerza HTTPS si el despliegue termina en TLS
    #   Permissions-Policy   → se apagan funciones que la app no usa
    #   CSP                  → solo recursos propios; unsafe-inline lo exigen los
    #                          estilos que Vite inyecta en el build actual
    #   Cache-Control no-store → respuestas sin datos de proyecto en caché

    # Favicon explícito — evita 404 en :5173/favicon.ico
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =204;
        access_log off;
    }
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =204;
        access_log off;
    }

    # Cache para assets con hash (vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — React Router
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://fi.undc.edu.pe https://drsu.undc.edu.pe https://scontent-lim1-1.xx.fbcdn.net https://sinergiacanetana.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: garantiza que el navegador cargue el bundle
    # vigente (evita sesiones con JS antiguo y errores 401 por token obsoleto).
    # OJO: este location responde el HTML de TODAS las rutas de la SPA (por el
    # try_files de "location /"), así que aquí también deben ir las cabeceras de
    # seguridad: en nginx, declarar add_header aquí sustituye los del location
    # anterior en lugar de sumarse.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://fi.undc.edu.pe https://drsu.undc.edu.pe https://scontent-lim1-1.xx.fbcdn.net https://sinergiacanetana.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        expires 0;
    }

    # Proxy API → Go backend (PostgreSQL 18). Upstream por variable de entorno.
    location /api/ {
        client_max_body_size 32M;
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        # CORS ya manejado por Go middleware
    }
    location /uploads/ {
        client_max_body_size 32M;
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }
    location = /health {
        proxy_pass http://${API_UPSTREAM}/health;
        access_log off;
    }
    # Swagger UI + spec → Go backend (swaggo)
    location /swagger/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Health del propio nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
