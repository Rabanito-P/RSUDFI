# UNDC RSU — Nginx reverse proxy + SPA fallback + gzip · PostgreSQL 18 stack
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32M;

    # Logs a stdout para docker
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip y compresion
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Seguridad basica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Favicon explícito — evita 404 en :5173/favicon.ico
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =204;
        access_log off;
    }
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =204;
        access_log off;
    }

    # Cache para assets con hash (vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → Go backend (PostgreSQL 18)
    location /api/ {
        client_max_body_size 32M;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        # CORS ya manejado por Go middleware
    }
    location /uploads/ {
        client_max_body_size 32M;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }
    location = /health {
        proxy_pass http://backend:8080/health;
        access_log off;
    }
    # Health del propio nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
