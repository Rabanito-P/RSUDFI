<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Universidad Nacional de Cañete — Facultad de Ingeniería">
  <defs>
    <path id="arco-sup" d="M 96,268 A 160,160 0 0 1 416,268" fill="none"/>
    <path id="arco-inf" d="M 122,268 A 134,134 0 0 0 390,268" fill="none"/>
  </defs>

  <!-- Engranaje exterior -->
  <g fill="#0F2B24">
    <circle cx="256" cy="256" r="196" fill="none" stroke="#0F2B24" stroke-width="16"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#0F2B24" stroke-width="10"/>
    <!-- Dientes del engranaje -->
    <g>
      <rect x="240" y="34" width="32" height="42" rx="4"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(30 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(60 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(90 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(120 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(150 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(180 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(210 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(240 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(270 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(300 256 256)"/>
      <rect x="240" y="34" width="32" height="42" rx="4" transform="rotate(330 256 256)"/>
    </g>
  </g>

  <!-- Textos curvos -->
  <text fill="#0F2B24" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="2">
    <textPath href="#arco-sup" startOffset="50%" text-anchor="middle">UNIVERSIDAD NACIONAL DE CAÑETE</textPath>
  </text>
  <text fill="#0F2B24" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" letter-spacing="3">
    <textPath href="#arco-inf" startOffset="50%" text-anchor="middle">FACULTAD DE INGENIERÍA</textPath>
  </text>

  <!-- Contenido interior -->
  <g fill="#0F2B24">
    <!-- Antena / torre (izquierda) -->
    <path d="M150 300 L164 232 L178 300 Z"/>
    <circle cx="164" cy="222" r="8"/>
    <path d="M148 240 q16 -14 32 0" fill="none" stroke="#0F2B24" stroke-width="7" stroke-linecap="round"/>
    <path d="M142 226 q22 -20 44 0" fill="none" stroke="#0F2B24" stroke-width="7" stroke-linecap="round"/>

    <!-- Chip / procesador (derecha) -->
    <rect x="330" y="196" width="70" height="70" rx="9"/>
    <rect x="352" y="218" width="26" height="26" rx="4" fill="#FFFFFF"/>
    <g stroke="#0F2B24" stroke-width="7" stroke-linecap="round">
      <path d="M344 196 v-14"/><path d="M365 196 v-14"/><path d="M386 196 v-14"/>
      <path d="M344 266 v14"/><path d="M365 266 v14"/><path d="M386 266 v14"/>
      <path d="M330 212 h-14"/><path d="M330 231 h-14"/><path d="M330 250 h-14"/>
      <path d="M400 212 h14"/><path d="M400 231 h14"/><path d="M400 250 h14"/>
    </g>

    <!-- Puente (derecha-abajo) -->
    <path d="M296 306 q34 -34 68 0" fill="none" stroke="#0F2B24" stroke-width="8"/>
    <path d="M296 306 h68" stroke="#0F2B24" stroke-width="8"/>
    <path d="M312 306 v-14 M330 306 v-20 M348 306 v-14" stroke="#0F2B24" stroke-width="7" stroke-linecap="round"/>

    <!-- Laptop con candado (centro) -->
    <path d="M196 232 h136 l14 22 h-164 Z"/>
    <rect x="182" y="254" width="164" height="20" rx="6"/>
    <!-- Engranaje pequeño sobre el teclado -->
    <circle cx="264" cy="222" r="26"/>
    <circle cx="264" cy="222" r="10" fill="#FFFFFF"/>
    <g stroke="#0F2B24" stroke-width="9" stroke-linecap="round">
      <path d="M264 190 v-10"/><path d="M264 254 v10"/><path d="M232 222 h-10"/><path d="M296 222 h10"/>
      <path d="M242 200 l-7 -7"/><path d="M286 244 l7 7"/><path d="M286 200 l7 -7"/><path d="M242 244 l-7 7"/>
    </g>

    <!-- Barras de datos (izquierda-abajo) -->
    <rect x="176" y="326" width="18" height="30" rx="3"/>
    <rect x="202" y="312" width="18" height="44" rx="3"/>
    <rect x="228" y="296" width="18" height="60" rx="3"/>
    <path d="M180 300 l24 -22 l24 16l24 -30" fill="none" stroke="#0F2B24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
