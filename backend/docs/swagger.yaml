definitions:
  undc-rsu_backend_internal_domain.RSUAsistenciaBeneficiario:
    properties:
      beneficiario:
        $ref: '#/definitions/undc-rsu_backend_internal_domain.RSUBeneficiario'
      firma_url:
        type: string
      id_actividad:
        type: integer
      id_asistencia:
        type: integer
      id_beneficiario:
        type: integer
      observaciones:
        type: string
    type: object
  undc-rsu_backend_internal_domain.RSUBeneficiario:
    properties:
      activo:
        type: boolean
      apellidos:
        type: string
      celular:
        type: string
      condicion_vulnerabilidad:
        type: string
      correo_electronico:
        type: string
      departamento:
        type: string
      direccion:
        type: string
      distrito:
        type: string
      dni:
        type: string
      fecha_registro:
        type: string
      id_beneficiario:
        type: integer
      nombres:
        type: string
      provincia:
        type: string
      razon_social:
        type: string
      ruc:
        type: string
      sexo:
        type: string
      tipo_beneficiario:
        type: string
    type: object
  undc-rsu_backend_internal_dto.CambioLiderReq:
    properties:
      id_nuevo_lider:
        type: integer
      motivo:
        maxLength: 500
        type: string
    required:
    - id_nuevo_lider
    - motivo
    type: object
  undc-rsu_backend_internal_dto.ExpulsionReq:
    properties:
      causal:
        enum:
        - FALTAS
        - TARDANZAS
        - CONDUCTA
        - OTRO
        type: string
      id_estudiante:
        type: integer
      motivo:
        maxLength: 500
        minLength: 10
        type: string
    required:
    - causal
    - id_estudiante
    - motivo
    type: object
  undc-rsu_backend_internal_dto.LoginReq:
    properties:
      correo:
        type: string
      password:
        type: string
    required:
    - correo
    - password
    type: object
  undc-rsu_backend_internal_dto.LoginResp:
    properties:
      correo:
        type: string
      id:
        type: integer
      nombre:
        type: string
      persona_id:
        type: integer
      rol:
        type: string
      rol_actor:
        type: string
      rol_actor_id:
        type: integer
      tipo_actor:
        type: string
      token:
        type: string
    type: object
  undc-rsu_backend_internal_service.DecisionAsesorReq:
    properties:
      decision:
        enum:
        - ACEPTAR
        - RECHAZAR
        type: string
      id_proyecto:
        type: integer
      motivo:
        description: Rechazar exige motivo (regla R26 vigente, conservada).
        type: string
    required:
    - decision
    - id_proyecto
    type: object
  undc-rsu_backend_internal_service.EnviarAsesorReq:
    properties:
      comentario:
        type: string
      id_docente_asesor:
        type: integer
      id_proyecto:
        type: integer
    required:
    - id_proyecto
    type: object
host: localhost:8080
info:
  contact:
    name: UNDC Cañete — RSU
  description: |-
    API de Responsabilidad Social Universitaria — UNDC Cañete (Ley 30220 Art.124-125, SUNEDU Ind.29, SINEACE Est.25).
    Auth real contra tabla RSU_Usuario (bcrypt + JWT). Storage local activo.
  license:
    name: Uso institucional UNDC
  title: UNDC RSU API
  version: "1.0"
paths:
  /api/v1/actividades:
    post:
      consumes:
      - application/json
      parameters:
      - description: Cuerpo JSON
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
