        "401":
          description: No autorizado
          schema:
            additionalProperties: true
            type: object
      tags:
      - Ejecución
  /api/v1/actividades/{id}/asistencia:
    get:
      parameters:
      - description: ID de la actividad de campo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/undc-rsu_backend_internal_domain.RSUAsistenciaBeneficiario'
            type: array
      tags:
      - Ejecución
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID de la actividad de campo
        in: path
        name: id
        required: true
        type: integer
      - description: IDs repetidos de beneficiarios asistentes
        in: formData
        name: beneficiarios
        required: true
        type: string
      - description: Firma escaneada JPG/PNG (≤2MB)
        in: formData
        name: firma
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 'Resumen: registradas/duplicadas'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Sin beneficiarios o no vinculados
          schema:
            additionalProperties: true
            type: object
        "403":
          description: No es miembro activo
          schema:
            additionalProperties: true
            type: object
      tags:
      - Ejecución
  /api/v1/actividades/{id}/estado:
    patch:
